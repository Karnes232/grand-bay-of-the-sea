[build]
  # verify-messages runs first and is cheap: a missing key or dropped ICU
  # placeholder in messages/*.json is a runtime MISSING_MESSAGE crash, so it is
  # better caught in two seconds than after a full build.
  command = "node scripts/verify-messages.mjs && npm run build && node scripts/verify-metadata.mjs"
  publish = ".next"

# Canonical host: single-hop 301s from http/apex straight to https://www
# (previously http://apex needed two hops: ->https://apex ->https://www).
[[redirects]]
  from = "http://grandbay-puntacana.com/*"
  to = "https://www.grandbay-puntacana.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://grandbay-puntacana.com/*"
  to = "https://www.grandbay-puntacana.com/:splat"
  status = 301
  force = true

# Retired-URL 301s are NOT declared here. They live in `src/middleware.ts`,
# because this middleware is deployed as a Netlify edge function and edge
# functions run before redirect rules: next-intl rewrites the unprefixed
# default-locale path to /en/… and serves it from the edge, so a rule declared
# here is never reached for English. The DR Web Studio rule sat here with
# `force = true` from 11 July to 30 August and only ever worked for /es/.

# Image optimization redirects
[[redirects]]
  from = '/_next/image/*'
  query = { q = ':quality', url = ':url', w = ':width' }
  to = '/.netlify/images?url=:url&w=:width&q=:quality'
  status = 200
  force = true

# Force correct MIME types for Next.js static assets (fixes CSS/JS served as text/plain)
[[headers]]
  for = "/_next/static/css/*"
  [headers.values]
    Content-Type = "text/css"

[[headers]]
  for = "/_next/static/chunks/*"
  [headers.values]
    Content-Type = "application/javascript"

# Cache headers for better performance
[[headers]]
  for = "/messages/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, s-maxage=86400"

# Do not set Cache-Control on "/*" — it overrides Next.js / Netlify ISR headers and
# forces every HTML request to miss the edge cache (slow TTFB, bad LCP in lab tests).
# SAMEORIGIN matches the value next.config.mjs sends on SSR responses
# (was DENY here, causing conflicting values). X-XSS-Protection is deprecated.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_SHARP_PATH = "./node_modules/sharp"
  # German locale launch gate. NEXT_PUBLIC_* is inlined at build time, so this
  # has to be set for the build, not the runtime. Set here rather than in the
  # Netlify UI so the switch is version-controlled and revertable in one commit.
  # Removing this line takes /de dark again on the next deploy; the German
  # content stays in Sanity either way.
  NEXT_PUBLIC_LOCALE_DE_ENABLED = "true"
  # French launched 2026-08-31: all 1,768 service-site segments translated and
  # published to Sanity, and all 286 UI strings in messages/fr.json. The blog is
  # English/Spanish plus per-post German only — French posts would be a further
  # 832 segments, so /fr/blog redirects to /blog for now (PER_POST_BLOG).
  # Setting this to "false" takes /fr dark again on the next deploy; the French
  # content stays in Sanity either way.
  NEXT_PUBLIC_LOCALE_FR_ENABLED = "true"
